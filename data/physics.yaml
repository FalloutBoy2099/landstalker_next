# Physique du joueur (landstalker_next). Modifie ces valeurs puis appuie sur R dans le jeu pour les recharger.
gravity: 87.5       # unités de hauteur / s² (mesuré sur la ROM : le saut dure 24 images et monte de 28/16)
jump_height: 1.75   # hauteur du sommet du saut, en unités (mesuré sur la ROM : 28/16) ; la vitesse de départ en découle
max_fall_speed: 30.0
walk_speed: 7.5     # cellules / s (mesuré sur la ROM : 2/16 de cellule par image à 60 Hz)
step_up: 0.5      # hauteur max d'une marche franchie sans sauter (les marches d'un escalier demandent un saut)
