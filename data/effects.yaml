# The graphic effects (landstalker.ini, [effects]): the pictures each one works on, found by tools/detect_effects.py, and its parameters.
# flame:  tiles: room -> the blocks (16x16, numbered as in the room's blocks.png) whose picture is a flame; entities: entity type -> its flame pictures.
#         light: what a flame lights (colour, strength, flicker in 0..1, flicker speed in Hz).
# environments, rules, rooms: how each kind of place (outdoor, interior, cave) is lit and graded, and which kind each room is (see the tool).
environments:
  outdoor:
    ambient: 1.0
    tint: [1.0, 1.0, 1.0]
    light_strength: 0.1
    light_radius: 2.4
    vignette: 0.05
    bloom: 0.12
    shadows: 0.0
    warmth: 0.0
    contrast: 1.0
    saturation: 1.0
  interior:
    ambient: 0.84
    tint: [1.0, 0.88, 0.72]
    light_strength: 0.2
    light_radius: 4.0
    vignette: 0.45
    bloom: 0.5
    shadows: 0.12
    warmth: 0.08
    contrast: 1.04
    saturation: 0.96
    night: [16, 20, 32]
    night_amount: 0.22

  cave:
    ambient: 0.92
    tint: [1.0, 0.85, 0.68]
    light_strength: 0.22
    light_radius: 5.0
    vignette: 0.45
    bloom: 0.55
    shadows: 0.12
    warmth: 0.05
    contrast: 1.08
    saturation: 0.8
rules:
- env: outdoor
  path: [outside, kado's house/]
- env: cave
  path: [helga's hut/]
- env: interior
  path: [/interior/, shop, house, hut, church, inn, bedroom, lighthouse, kitchen, bunk]
- env: cave
  path: [massan secret cave, destel well/, waterfall shrine/, swamp shrine/, lake shrine/, labyrinth/, king nole's cave/, king nole's palace/, thieves' hideout/,
    verla mine/, mercator crypt/, kazalt/, underground, passageway, secret path, tunnel, mines]
- env: outdoor
  path: [overworld/, mountainous, greenmaze, tree warps, mercator/, ryuma/, verla/, gumi/, massan/, destel/, tibor/]
rooms: {}
